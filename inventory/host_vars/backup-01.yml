---
# Реальные диски под RAID1 — проверьте перед запуском:
#   lsblk -o NAME,SIZE,TYPE,SERIAL
storage_raid_arrays:
  - name: "/dev/md0"
    level: 1
    devices:
      - "/dev/disk/by-id/ata-CHANGE_ME_HDD_1"
      - "/dev/disk/by-id/ata-CHANGE_ME_HDD_2"

storage_volumes:
  - device: "/dev/md0"
    mountpoint: "/backup"
    fstype: "ext4"
    opts: "defaults,noatime"
    mode: "0750"
    label: "nekta-backup"

# Суммарный объём дисков защищаемых серверов, ГБ — для проверки правила
# «объём хранилища копий не менее трёхкратного». Оставьте пустым, если
# сервер приложения опрашивается в том же запуске: значение возьмётся из
# его фактов.
requirements_backup_protected_gb: ""
