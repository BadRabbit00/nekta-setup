---
# Реальные устройства этого сервера — проверьте перед запуском:
#   lsblk -o NAME,SIZE,TYPE,FSTYPE,SERIAL,MOUNTPOINT
#   ls -l /dev/disk/by-id/
storage_volumes:
  - device: "/dev/disk/by-id/ata-CHANGE_ME_DATA_DISK"
    mountpoint: "/nekta"
    fstype: "ext4"
    opts: "defaults,noatime"
    label: "nekta-data"

# Профиль обмена: усредните по парку приборов учёта.
requirements_msgs_per_device_per_day: 2
requirements_retention_years: 3

# Сведения для передачи в техподдержку Nekta (пункт 5 «Подготовки к установке»).
handover_public_url: "https://nekta.example.org"
handover_admin_email: "admin@example.org"
handover_retention_years: 3

# ИБП: кабель USB подключён к этому серверу.
nut_ups_description: "ИБП в машзале"
nut_ups_driver: "usbhid-ups"
nut_ups_port: "auto"
