---
# Параметры конкретного сервера Nekta.
# URL, по которому будет доступен web-интерфейс (сообщается в поддержку Nekta).
nekta_public_url: "https://nekta.example.org"
nekta_admin_email: "admin@example.org"

# Реальные блочные устройства этого сервера — проверьте `lsblk` перед запуском.
storage_volumes:
  - device: "/dev/disk/by-id/ata-CHANGE_ME_DATA_DISK"
    mountpoint: "/nekta"
    fstype: "ext4"
    opts: "defaults,noatime"
    owner: "root"
    group: "root"
    mode: "0755"
    label: "nekta-data"

# Профиль обмена: усредните по типам приборов учёта.
# Пример для электросчётчиков — 97 сообщений в сутки.
nekta_msgs_per_device_per_day: 2
nekta_retention_years: 3

# Параметры ИБП (кабель USB подключён к этому серверу).
nut_ups_description: "APC Smart-UPS, машзал"
nut_ups_driver: "usbhid-ups"
nut_ups_port: "auto"
