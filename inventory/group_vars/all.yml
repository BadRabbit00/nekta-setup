---
# ============================================================================
#  Общие параметры площадки.
#
#  Плейбуки выполняют только то, что предписано документацией Nekta
#  («Подготовка к установке» и «Системные требования»), плюс настройку ИБП
#  по отдельному требованию заказчика. Границы работ — docs/00-scope.md
# ============================================================================

# Внутренняя сеть, в которой находятся оба сервера (нужна для NUT).
site_internal_network: "192.0.2.0/24"

# Сети, из которых разрешено административное подключение.
# Используются, только если включён firewall_restrict_ssh_to_management.
site_management_networks:
  - "192.0.2.0/24"

# Адреса техподдержки Nekta. Документация: «Если доступ к портам ограничен
# по IP, то необходимо его открыть для следующих адресов».
nekta_support_ips:
  - "217.113.124.240"
  - "84.201.166.187"

# Внешние ресурсы, к которым нужен исходящий доступ с сервера Nekta
# (для всех уровней поддоменов). Проверяются ролью requirements.
requirements_outbound_endpoints:
  - { host: "217.113.124.240", port: 443 }
  - { host: "84.201.166.187", port: 8000 }
  - { host: "docker.nekta.cloud", port: 443 }
  - { host: "ppa.launchpad.net", port: 443 }
  - { host: "archive.ubuntu.com", port: 80 }
  - { host: "ru.archive.ubuntu.com", port: 80 }

# --- ИБП (вне требований Nekta, по заданию заказчика) --------------------
# netserver — кабель USB подключён сюда; netclient — состояние по сети.
nut_mode: "netclient"
nut_ups_name: "ups0"
nut_server_host: "{{ hostvars[groups['nekta'][0]].ansible_host | default(groups['nekta'][0]) }}"
nut_listen_port: 3493
