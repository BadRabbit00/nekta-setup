---
# ============================================================================
#  Сервер резервного копирования.
#
#  Системные требования вендора:
#    процессор 4 ядра / 8 потоков
#    ОЗУ 8 ГБ
#    диск 1 (система)  SSD 120 ГБ
#    диск 2 (хранение) RAID1 из 2 x HDD
#    объём хранилища копий >= 3x объёма дисков защищаемых серверов
#    сеть до защищаемых серверов 1 Гбит/с
#
#  Программное обеспечение резервного копирования документацией Nekta не
#  описано и здесь не настраивается — см. docs/00-scope.md
# ============================================================================

requirements_profile: "backup"

# --- Диск 2: программный RAID1 из двух HDD --------------------------------
storage_raid_create: true
storage_raid_arrays:
  - name: "/dev/md0"
    level: 1
    devices:
      - "/dev/sdb"
      - "/dev/sdc"

# Точка монтирования массива в документации не указана: имя выбрано нами,
# меняется свободно.
storage_volumes:
  - device: "/dev/md0"
    mountpoint: "/backup"
    fstype: "ext4"
    opts: "defaults,noatime"
    mode: "0750"
    label: "nekta-backup"

# Входящих служб на этом сервере нет: требований к портам документация
# не предъявляет.
firewall_enabled: false

# --- ИБП ------------------------------------------------------------------
nut_mode: "netclient"
