---
# ============================================================================
#  Сервер приложения Nekta Server, профиль «до 10 000 устройств».
#
#  Системные требования вендора:
#    процессор 4 ядра / 8 потоков, не ниже 2 ГГц
#    ОЗУ от 20 ГБ
#    диск 1 (система)  SSD 120 ГБ
#    диск 2 (хранение) HDD, объём рассчитывается, монтируется в /nekta
#    сеть 100 Мбит/с
# ============================================================================

requirements_profile: "nekta"
requirements_devices: 10000

# Расчёт объёма диска хранения. Число сообщений в сутки зависит от типа
# приборов учёта: вода — около 2, электричество — до 97.
# Подробнее и таблица объёмов: docs/01-sizing.md
requirements_msgs_per_device_per_day: 2
requirements_retention_years: 3
requirements_storage_overhead_percent: 30

# --- Диск 2 (хранение) ----------------------------------------------------
# «Диск 2 (хранение) необходимо монтировать на директорию /nekta».
# Устройство задаётся в inventory/host_vars — проверьте lsblk перед запуском.
storage_volumes:
  - device: "/dev/sdb"
    mountpoint: "/nekta"
    fstype: "ext4"
    opts: "defaults,noatime"
    label: "nekta-data"

# --- Порты ----------------------------------------------------------------
# Комментарий «переназначать нельзя» — прямое требование документации.
# SSH открывает сама роль firewall.
firewall_enabled: true
firewall_rules:
  - { port: 80, proto: tcp, comment: "Веб-интерфейс HTTP (можно переназначить)" }
  - { port: 81, proto: tcp, comment: "Веб-интерфейс (переназначать нельзя)" }
  - { port: 443, proto: tcp, comment: "Веб-интерфейс HTTPS (можно переназначить)" }
  - { port: 4443, proto: tcp, comment: "Веб-интерфейс HTTPS (переназначать нельзя)" }
  - { port: 3003, proto: tcp, comment: "Push-уведомления (переназначать нельзя)" }
  - { port: 6060, proto: tcp, comment: "Веб-интерфейс сетевого сервера LoRaWAN" }
  - { port: 1600, proto: udp, comment: "Приём данных с базовых станций LoRaWAN" }

# «Дополнительно, для отладки и диагностики — 82 TCP».
firewall_support_only_rules:
  - { port: 82, proto: tcp, comment: "Отладка и диагностика (только поддержка Nekta)" }

# --- ИБП ------------------------------------------------------------------
# Кабель USB от ИБП подключён к этому серверу.
nut_mode: "netserver"
