---
# ============================================================================
#  Сервер приложения Nekta Server. Профиль — до 10 000 устройств.
#
#  Требования вендора (см. docs/01-sizing-10k.md):
#    CPU  4 ядра / 8 потоков, не ниже 2 ГГц
#    RAM  от 20 ГБ
#    Диск 1 (система)  SSD 120 ГБ
#    Диск 2 (хранение) HDD, монтируется в /nekta
#    Сеть 100 Мбит/с
# ============================================================================

# --- Профиль нагрузки для проверок и расчёта объёма /nekta ---------------
nekta_profile_devices: 10000
nekta_profile_min_cpu_cores: 4
nekta_profile_min_cpu_threads: 8
nekta_profile_min_cpu_mhz: 2000
nekta_profile_min_ram_gb: 20
nekta_profile_min_system_disk_gb: 120

# Расчёт объёма диска хранения (методика вендора):
#   объём = устройства x сообщений/сутки x 2 КБ x 365 x лет x (1 + запас)
nekta_msg_size_kb: 2
nekta_msgs_per_device_per_day: 2      # напр. вода 2 раза в сутки; для электро — 97
nekta_retention_years: 3
nekta_storage_overhead_percent: 30    # запас на ручные опросы и журналы событий

# --- Диски ----------------------------------------------------------------
# ВНИМАНИЕ: форматирование выполняется только если на устройстве нет ФС,
# либо явно задано storage_force_format=true. См. docs/02-storage.md
storage_volumes:
  - device: "/dev/sdb"
    mountpoint: "/nekta"
    fstype: "ext4"
    opts: "defaults,noatime"
    owner: "root"
    group: "root"
    mode: "0755"
    label: "nekta-data"

# --- SSH ------------------------------------------------------------------
# Техподдержка Nekta подключается по SSH с логином и паролем — на период
# установки и обновления парольная аутентификация должна быть включена.
# После сдачи системы переведите на ключи: common_ssh_password_authentication: false
common_ssh_password_authentication: true

# Стек обслуживает вендор — автообновления пакетов выключены,
# чтобы apt не тронул docker и зависимости во время работы.
common_unattended_upgrades: false

# --- Firewall -------------------------------------------------------------
firewall_enabled: true
firewall_default_incoming: "deny"

# Порты Nekta Server. Комментарий «нельзя переназначать» — из документации.
# SSH роль firewall открывает сама (в том числе с ограничением по сетям
# управления), поэтому здесь его нет.
firewall_rules:
  - { port: 80, proto: tcp, comment: "Web HTTP (можно переназначить)" }
  - { port: 81, proto: tcp, comment: "Web (переназначать нельзя)" }
  - { port: 443, proto: tcp, comment: "Web HTTPS (можно переназначить)" }
  - { port: 4443, proto: tcp, comment: "Web HTTPS (переназначать нельзя)" }
  - { port: 3003, proto: tcp, comment: "Push-уведомления (переназначать нельзя)" }
  - { port: 6060, proto: tcp, comment: "Web-интерфейс LoRaWAN network server" }
  - { port: 1600, proto: udp, comment: "Приём данных с базовых станций LoRaWAN" }

# Порт диагностики 82/tcp открывается только для адресов техподдержки.
firewall_support_only_rules:
  - { port: 82, proto: tcp, comment: "Отладка и диагностика (только поддержка Nekta)" }

# Доступ на сервер бэкапа не нужен: копии забираются по pull-модели.
firewall_allow_from_backup:
  - { port: "{{ common_ssh_port }}", proto: tcp, comment: "Pull-бэкап с backup-сервера" }

# --- Docker ---------------------------------------------------------------
# Docker ставит вендор. Мы заранее кладём daemon.json, чтобы логи контейнеров
# не съели системный SSD, и фиксируем пулы адресов.
nekta_docker_daemon_config: true
nekta_docker_log_max_size: "50m"
nekta_docker_log_max_file: 3

# --- Агент резервного копирования ----------------------------------------
# Учётная запись, под которой backup-сервер забирает данные (pull).
nekta_backup_user: "nekta-backup"
nekta_backup_paths:
  - "/nekta"
  - "/etc"
  - "/root"
  - "/var/spool/cron"
nekta_backup_exclude:
  - "/nekta/backup-dumps/tmp"
  - "/nekta/**/*.sock"
  - "/nekta/**/lost+found"
# Дампы БД из контейнеров перед снятием копии.
nekta_predump_enabled: true
nekta_predump_keep: 3
nekta_predump_dir: "/nekta/backup-dumps"

# --- ИБП ------------------------------------------------------------------
# Кабель USB от ИБП воткнут в этот сервер.
nut_mode: "netserver"
