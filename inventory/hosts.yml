---
# Инвентарь стенда Nekta: два физических сервера.
#
#   nekta-01   — сервер приложения Nekta Server (расчёт на 10 000 устройств)
#   backup-01  — сервер резервного копирования
#
# UPS с USB-интерфейсом подключён кабелем к одному из серверов (по умолчанию
# к nekta-01); второй сервер получает состояние ИБП по сети через NUT.
# См. docs/03-ups-nut.md
all:
  children:
    nekta:
      hosts:
        nekta-01:
          ansible_host: 192.168.0.107
    backup:
      hosts:
        backup-01:
          ansible_host: 192.168.0.108

  vars:
    ansible_user: nekta-app
    ansible_port: 22
    ansible_ssh_private_key_file: ~/.ssh/nekta
    ansible_python_interpreter: /usr/bin/python3
