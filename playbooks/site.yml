---
# Полная настройка площадки: сервер Nekta + сервер резервного копирования.
#
# Порядок плеев важен: сервер резервного копирования отрабатывает первым и
# генерирует ключ SSH, который затем прописывается агенту бэкапа на сервере
# Nekta. UPS настраивается последним, когда обе машины уже доступны по сети.
- name: Сервер резервного копирования
  ansible.builtin.import_playbook: backup.yml

- name: Сервер приложения Nekta
  ansible.builtin.import_playbook: nekta.yml

- name: Источник бесперебойного питания
  ansible.builtin.import_playbook: ups.yml
