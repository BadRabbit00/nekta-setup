---
# Подготовка обоих серверов.
#
# Сервер приложения идёт первым: его факты об объёме дисков нужны серверу
# копий для проверки правила «объём хранилища не менее трёхкратного».
#
# ИБП настраивается отдельным плейбуком (playbooks/ups.yml) и намеренно не
# входит сюда: документация требует передавать вендору «чистую» ОС без
# дополнительных компонентов, а NUT — это дополнительные пакеты. Запускайте
# ups.yml после того, как вендор установит Nekta Server.
- name: Сервер приложения Nekta
  ansible.builtin.import_playbook: nekta.yml

- name: Сервер резервного копирования
  ansible.builtin.import_playbook: backup.yml
