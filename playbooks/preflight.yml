---
# Проверка соответствия системным требованиям Nekta. Ничего не меняет.
#
#   ansible-playbook playbooks/preflight.yml
#
# Запускайте до приёмки оборудования и перед передачей доступа вендору.
- name: Проверка требований
  hosts: nekta:backup
  become: true
  gather_facts: true
  order: inventory

  tasks:
    - name: Выполнить проверки
      ansible.builtin.include_role:
        name: requirements
      vars:
        requirements_strict: false
