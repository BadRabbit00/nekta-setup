---
# Ручной запуск резервного копирования и вывод состояния.
#
#   ansible-playbook playbooks/backup-run.yml
#   ansible-playbook playbooks/backup-run.yml -e backup_dry_run=true
- name: Запуск резервного копирования
  hosts: backup
  become: true
  gather_facts: false
  vars:
    backup_dry_run: false

  tasks:
    - name: Выполнить резервное копирование
      ansible.builtin.command:
        cmd: "/usr/local/sbin/nekta-backup{{ ' --dry-run' if backup_dry_run | bool else '' }}"
      register: backup_run
      changed_when: not (backup_dry_run | bool)
      failed_when: backup_run.rc != 0

    - name: Показать журнал выполнения
      ansible.builtin.debug:
        var: backup_run.stdout_lines

    - name: Показать состояние копий
      ansible.builtin.command:
        cmd: /usr/local/sbin/nekta-backup-status
      register: backup_status
      changed_when: false
      failed_when: false

    - name: Вывести состояние
      ansible.builtin.debug:
        var: backup_status.stdout_lines
