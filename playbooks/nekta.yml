---
# Подготовка сервера приложения по документации Nekta:
#   - проверка системных требований и исходящего доступа
#   - монтирование диска 2 в /nekta
#   - открытие портов
#   - сбор сведений для передачи в техподдержку
#
# Установку самого Nekta Server выполняет вендор по SSH.
- name: Подготовка сервера приложения Nekta Server
  hosts: nekta
  become: true
  gather_facts: true

  roles:
    - role: requirements
      tags: [requirements, preflight]
    - role: storage
      tags: [storage]
    - role: firewall
      tags: [firewall]
    - role: handover
      tags: [handover]
