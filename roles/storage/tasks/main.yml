---
# Требование вендора: ОС передаётся «чистой», без дополнительных
# компонентов. Поэтому ставим только то, без чего не создать нужную
# файловую систему: xfsprogs — если среди томов есть xfs, e2fsprogs в
# Ubuntu Server уже присутствует.
- name: Установить утилиты файловой системы xfs
  ansible.builtin.apt:
    name: xfsprogs
    state: present
  when: storage_volumes | selectattr('fstype', 'equalto', 'xfs') | list | length > 0
  tags: [storage, packages]

- name: Настроить программный RAID
  ansible.builtin.import_tasks: raid.yml
  when: storage_raid_create | bool and storage_raid_arrays | length > 0
  tags: [storage, raid]

- name: Подготовить и смонтировать тома
  ansible.builtin.include_tasks: volume.yml
  loop: "{{ storage_volumes }}"
  loop_control:
    loop_var: vol
    label: "{{ vol.device }} -> {{ vol.mountpoint }}"
  tags: [storage, mount]
