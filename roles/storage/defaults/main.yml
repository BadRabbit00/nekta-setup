---
storage_volumes: []

# Программный RAID (используется на сервере резервного копирования).
storage_raid_create: false
storage_raid_arrays: []
storage_raid_monitor_mail: "root"

# ПРЕДОХРАНИТЕЛЬ. Пока false, роль отказывается создавать ФС или RAID
# на устройстве, где уже есть файловая система, LVM или таблица разделов.
# Включайте осознанно и только для конкретного запуска:
#   ansible-playbook ... -e storage_force_format=true
storage_force_format: false

# Резерв суперпользователя в ext4. Пусто — оставить умолчание системы (5%).
# В документации Nekta про это ничего нет, поэтому по умолчанию не трогаем;
# на многотерабайтном диске 5% — это десятки гигабайт, и значение 1 их
# возвращает.
storage_reserved_blocks_percentage: ""
