---
- name: Проверить поддерживаемость операционной системы
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - >-
        (ansible_facts.distribution != "Ubuntu")
        or (ansible_facts.distribution_version is version('20.04', '>='))
    fail_msg: >-
      Nekta Server поддерживается на Ubuntu Server 20.04+, Astra Linux 2.12.45+
      и Red Star OS 4.0+. Обнаружено:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: "ОС поддерживается: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
  tags: [common, assert]

- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ common_base_packages + common_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: common_pkg_install
  retries: 3
  delay: 10
  until: common_pkg_install is succeeded
  tags: [common, packages]

- name: Настроить время и синхронизацию
  ansible.builtin.import_tasks: time.yml
  tags: [common, time]

- name: Настроить локали
  ansible.builtin.import_tasks: locale.yml
  tags: [common, locale]

- name: Применить параметры ядра и лимиты
  ansible.builtin.import_tasks: tuning.yml
  tags: [common, tuning]

- name: Ограничить размер журналов systemd
  ansible.builtin.import_tasks: journald.yml
  tags: [common, journald]

- name: Создать административные учётные записи
  ansible.builtin.import_tasks: users.yml
  tags: [common, users]

- name: Настроить SSH
  ansible.builtin.import_tasks: ssh.yml
  when: common_ssh_manage | bool
  tags: [common, ssh]

- name: Настроить автоматические обновления безопасности
  ansible.builtin.import_tasks: unattended.yml
  tags: [common, updates]

- name: Настроить отправку почтовых уведомлений
  ansible.builtin.import_tasks: mail.yml
  when: common_mail_enabled | bool
  tags: [common, mail]

- name: Настроить контроль состояния дисков (S.M.A.R.T.)
  ansible.builtin.import_tasks: smartd.yml
  when: common_smartd_enabled | bool
  tags: [common, smart]
