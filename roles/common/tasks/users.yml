---
- name: Создать административных пользователей
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    groups: "{{ item.groups | default(['sudo']) | join(',') }}"
    append: true
    shell: "{{ item.shell | default('/bin/bash') }}"
    password: "{{ item.password | default(omit) }}"
    update_password: "{{ 'always' if item.password is defined else 'on_create' }}"
    state: present
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Разложить публичные SSH-ключи
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    exclusive: false
  loop: "{{ common_admin_users | subelements('ssh_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Разрешить sudo без пароля выбранным пользователям
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/60-{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ common_admin_users | selectattr('sudo_nopasswd', 'defined') | selectattr('sudo_nopasswd') | list }}"
  loop_control:
    label: "{{ item.name }}"
