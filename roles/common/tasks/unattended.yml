---
- name: Установить unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Настроить автоматические обновления безопасности
  ansible.builtin.template:
    src: 60-nekta-unattended.conf.j2
    dest: /etc/apt/apt.conf.d/60-nekta-unattended
    owner: root
    group: root
    mode: "0644"

- name: Управлять таймерами автообновлений
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ common_unattended_upgrades | bool }}"
    state: "{{ 'started' if common_unattended_upgrades | bool else 'stopped' }}"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false
