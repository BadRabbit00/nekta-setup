---
- name: Создать каталог настроек journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ограничить объём журналов
  ansible.builtin.template:
    src: journald-nekta.conf.j2
    dest: /etc/systemd/journald.conf.d/60-nekta.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
