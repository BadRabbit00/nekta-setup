---
- name: Загрузить модуль nf_conntrack (нужен для net.netfilter.*)
  community.general.modprobe:
    name: nf_conntrack
    state: present
    persistent: present
  failed_when: false

- name: Применить параметры sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-nekta.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

- name: Поднять лимиты открытых файлов и процессов
  ansible.builtin.template:
    src: limits-nekta.conf.j2
    dest: /etc/security/limits.d/60-nekta.conf
    owner: root
    group: root
    mode: "0644"

- name: Создать каталоги drop-in для systemd
  ansible.builtin.file:
    path: "/etc/systemd/{{ item }}.conf.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - system
    - user

- name: Поднять лимиты для служб systemd
  ansible.builtin.template:
    src: systemd-limits.conf.j2
    dest: "/etc/systemd/{{ item }}.conf.d/60-nekta-limits.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - system
    - user
  notify: Reload systemd daemon
