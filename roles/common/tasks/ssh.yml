---
- name: Убедиться, что установлен сервер OpenSSH
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Создать каталог drop-in конфигураций sshd
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# В Ubuntu 20.04 директива Include в sshd_config отсутствует — без неё
# drop-in файлы не читаются.
- name: Проверить наличие Include в основном sshd_config
  ansible.builtin.command:
    cmd: "grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\\.d/' /etc/ssh/sshd_config"
  register: common_sshd_include
  changed_when: false
  failed_when: false

- name: Добавить Include в начало sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    firstmatch: true
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  when: common_sshd_include.rc != 0
  notify: Restart sshd

- name: Разложить параметры sshd
  ansible.builtin.template:
    src: sshd-nekta.conf.j2
    dest: /etc/ssh/sshd_config.d/60-nekta.conf
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

# Ubuntu 22.10+ активирует ssh.socket, из-за чего Port в конфиге игнорируется.
# Начиная с Ubuntu 22.10 sshd запускается по требованию через ssh.socket,
# и директива Port в конфигурации при этом не действует — слушающий порт
# задаётся юнитом сокета.
- name: Проверить, используется ли активация через сокет
  ansible.builtin.stat:
    path: /etc/systemd/system/sockets.target.wants/ssh.socket
  register: common_ssh_socket

- name: Синхронизировать порт для ssh.socket
  when: common_ssh_socket.stat.exists
  block:
    - name: Создать каталог drop-in для ssh.socket
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Задать порт прослушивания для ssh.socket
      ansible.builtin.copy:
        content: |
          [Socket]
          ListenStream=
          ListenStream={{ common_ssh_port }}
        dest: /etc/systemd/system/ssh.socket.d/60-nekta-port.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh socket

- name: Включить и запустить sshd
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
