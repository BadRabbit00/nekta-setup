---
common_timezone: "Europe/Moscow"
common_locales:
  - "en_US.UTF-8"
common_default_locale: "en_US.UTF-8"

common_ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# Базовый набор инструментов: диагностика сети, дисков и производительности.
common_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - htop
  - iotop
  - jq
  - lsof
  - ncdu
  - nvme-cli
  - python3-apt
  - rsync
  - smartmontools
  - sysstat
  - tcpdump
  - unzip
  - vim
  - wget
common_extra_packages: []

common_admin_users: []
common_manage_root_password: false

common_ssh_manage: true
common_ssh_port: 22
common_ssh_permit_root_login: "prohibit-password"
common_ssh_password_authentication: false
common_ssh_allow_users: []
common_ssh_allow_groups: []
common_ssh_client_alive_interval: 300
common_ssh_client_alive_count_max: 3
common_ssh_max_auth_tries: 4

common_unattended_upgrades: true
common_unattended_reboot: false
common_unattended_reboot_time: "04:30"

common_journald_max_use: "1G"
common_journald_max_file_size: "128M"

# Общесистемный тюнинг. Значения подобраны под сервер с БД и docker-стеком.
common_sysctl:
  vm.swappiness: 10
  vm.dirty_ratio: 15
  vm.dirty_background_ratio: 5
  vm.max_map_count: 262144
  vm.overcommit_memory: 1
  fs.file-max: 2097152
  fs.inotify.max_user_instances: 1024
  fs.inotify.max_user_watches: 524288
  net.core.somaxconn: 4096
  net.core.netdev_max_backlog: 5000
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_keepalive_time: 300
  net.ipv4.ip_local_port_range: "10240 65535"
  net.netfilter.nf_conntrack_max: 262144

common_nofile_limit: 1048576
common_nproc_limit: 65536

common_smartd_enabled: true

common_mail_enabled: false
common_mail_from: "root@{{ inventory_hostname }}"
common_mail_to: "root"
common_mail_host: "localhost"
common_mail_port: 25
common_mail_tls: false
common_mail_starttls: false
common_mail_user: ""
common_mail_password: ""
