---
firewall_enabled: true
firewall_default_incoming: "deny"
firewall_default_outgoing: "allow"
firewall_default_routed: "deny"
firewall_logging: "low"

# Порты, открытые для всех источников (список в inventory/group_vars).
firewall_rules: []

# Порты, открытые только адресам техподдержки Nekta.
firewall_support_only_rules: []
nekta_support_ips: []

# Дополнительные правила:
#   - { port: 3493, proto: tcp, from: "192.0.2.0/24", comment: "NUT" }
firewall_extra_rules: []

# Ограничить SSH сетями управления. По умолчанию выключено: вендор
# подключается из интернета, установка и обновление через VPN не выполняются.
firewall_restrict_ssh_to_management: false
site_management_networks: []

# Порт SSH. Документация допускает переназначение на другой внешний порт.
site_ssh_port: 22
