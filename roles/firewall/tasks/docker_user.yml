---
- name: Создать каталог конфигурации Nekta
  ansible.builtin.file:
    path: /etc/nekta
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Разложить список разрешённых источников для портов контейнеров
  ansible.builtin.template:
    src: docker-firewall.conf.j2
    dest: /etc/nekta/docker-firewall.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply docker user firewall

- name: Разложить скрипт правил DOCKER-USER
  ansible.builtin.copy:
    src: nekta-docker-firewall
    dest: /usr/local/sbin/nekta-docker-firewall
    owner: root
    group: root
    mode: "0755"
  notify: Apply docker user firewall

# Каталог drop-in создаётся заранее: docker ставит вендор позже, и правила
# начнут применяться автоматически при первом запуске службы.
- name: Создать каталог drop-in для docker.service
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Применять правила при каждом запуске docker
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Service]
      ExecStartPost=-/usr/local/sbin/nekta-docker-firewall apply
    dest: /etc/systemd/system/docker.service.d/60-nekta-firewall.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
