---
- name: Создать каталог конфигурации docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Проверить наличие уже установленного docker
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: nekta_daemon_json

# Файл, созданный вендором, не трогаем: у стека Nekta могут быть свои
# параметры демона. Свои настройки пишем только на «чистую» систему.
- name: Разложить daemon.json с ротацией логов
  ansible.builtin.template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: not nekta_daemon_json.stat.exists
  notify: Restart docker

- name: Предупредить о существующем daemon.json
  ansible.builtin.debug:
    msg: >-
      /etc/docker/daemon.json уже существует и не изменён. Проверьте вручную,
      что настроена ротация логов контейнеров (log-driver json-file,
      max-size/max-file) — иначе журналы заполнят системный SSD.
  when: nekta_daemon_json.stat.exists
