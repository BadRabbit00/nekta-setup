---
- name: Проверить, что том данных смонтирован
  ansible.builtin.assert:
    that:
      - ansible_facts.mounts | selectattr('mount', 'equalto', nekta_data_dir) | list | length > 0
    fail_msg: >-
      {{ nekta_data_dir }} не смонтирован. По требованиям вендора диск 2
      (хранение) монтируется именно в {{ nekta_data_dir }} — сначала выполните
      роль storage.

- name: Создать служебные каталоги
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ nekta_data_dir }}", mode: "0755" }
    - { path: "{{ nekta_predump_dir }}", mode: "0750" }
    - { path: "/etc/nekta", mode: "0755" }
    - { path: "/var/log/nekta", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"

- name: Записать паспорт установки
  ansible.builtin.template:
    src: install-info.j2
    dest: /etc/nekta/install-info
    owner: root
    group: root
    mode: "0644"
