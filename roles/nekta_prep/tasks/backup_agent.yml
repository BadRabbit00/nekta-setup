---
- name: Создать учётную запись для снятия резервных копий
  ansible.builtin.user:
    name: "{{ nekta_backup_user }}"
    comment: "Pull-агент резервного копирования"
    shell: /bin/bash
    home: "/home/{{ nekta_backup_user }}"
    create_home: true
    system: true
    state: present

- name: Разложить скрипт подготовки данных к копированию
  ansible.builtin.template:
    src: nekta-predump.j2
    dest: /usr/local/sbin/nekta-predump
    owner: root
    group: root
    mode: "0755"

# Учётной записи бэкапа нужны ровно две привилегированные операции:
# запустить дамп и прочитать файлы через rsync в режиме отправителя.
- name: Выдать точечные права sudo агенту бэкапа
  ansible.builtin.template:
    src: sudoers-backup.j2
    dest: "/etc/sudoers.d/70-{{ nekta_backup_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Разложить публичные ключи сервера резервного копирования
  ansible.posix.authorized_key:
    user: "{{ nekta_backup_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
    key_options: >-
      {{ ('from="' ~ (nekta_backup_allowed_from | join(',')) ~ '",')
         if nekta_backup_allowed_from | length > 0 else '' }}no-agent-forwarding,no-port-forwarding,no-user-rc,no-X11-forwarding
  loop: "{{ nekta_backup_pubkeys }}"
  loop_control:
    label: "{{ item.split()[-1] | default('key') }}"
  when: nekta_backup_pubkeys | length > 0

- name: Предупредить об отсутствии ключа backup-сервера
  ansible.builtin.debug:
    msg: >-
      Публичный ключ сервера резервного копирования не передан: доступ
      {{ nekta_backup_user }} не настроен. Запустите playbooks/site.yml целиком
      (сначала отрабатывает backup-сервер, он генерирует ключ) либо задайте
      nekta_backup_pubkeys вручную.
  when: nekta_backup_pubkeys | length == 0

- name: Настроить локальный запуск дампов по расписанию
  when: nekta_predump_timer_enabled | bool
  block:
    - name: Разложить unit для дампов
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          [Unit]
          Description=Подготовка дампов Nekta к резервному копированию
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/nekta-predump
          Nice=10
          IOSchedulingClass=idle
        dest: /etc/systemd/system/nekta-predump.service
        owner: root
        group: root
        mode: "0644"

    - name: Разложить таймер для дампов
      ansible.builtin.copy:
        content: |
          # {{ ansible_managed }}
          [Unit]
          Description=Ежедневная подготовка дампов Nekta

          [Timer]
          OnCalendar={{ nekta_predump_timer_schedule }}
          RandomizedDelaySec=5min
          Persistent=true

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/nekta-predump.timer
        owner: root
        group: root
        mode: "0644"

    - name: Включить таймер дампов
      ansible.builtin.systemd:
        name: nekta-predump.timer
        enabled: true
        state: started
        daemon_reload: true
