---
backup_root: "/backup"
backup_state_dir: "/var/lib/nekta-backup"
backup_log_dir: "/var/log/nekta-backup"
backup_conf_dir: "/etc/nekta/backup.conf.d"

# rsync — снимки на жёстких ссылках: восстановление обычным cp, без утилит.
# borg — дополнительно дедуплицированный архив поверх снимка.
backup_engine: "rsync"

backup_sources: []

backup_ssh_key_path: "/root/.ssh/id_ed25519_nekta_backup"
backup_ssh_key_type: "ed25519"

backup_schedule: "01:30"
backup_randomized_delay: "15min"
backup_bandwidth_limit_kbps: 0
backup_ionice: true
backup_timeout: "6h"

backup_keep_daily: 14
backup_keep_weekly: 8
backup_keep_monthly: 12

backup_min_free_percent: 15
backup_max_age_hours: 30

backup_borg_compression: "zstd,6"
backup_borg_passphrase: ""

backup_mail_enabled: "{{ common_mail_enabled | default(false) }}"
backup_mail_to: "{{ common_mail_to | default('root') }}"
# always — письмо после каждого запуска, onfail — только при ошибке
backup_mail_policy: "onfail"

backup_profile_min_cpu_cores: 4
backup_profile_min_ram_gb: 8
backup_profile_min_system_disk_gb: 120
backup_preflight_strict: true
