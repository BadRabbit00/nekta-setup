---
- name: Разложить unit резервного копирования
  ansible.builtin.template:
    src: nekta-backup.service.j2
    dest: /etc/systemd/system/nekta-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Разложить таймер резервного копирования
  ansible.builtin.template:
    src: nekta-backup.timer.j2
    dest: /etc/systemd/system/nekta-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Разложить unit контроля свежести копий
  ansible.builtin.template:
    src: nekta-backup-check.service.j2
    dest: /etc/systemd/system/nekta-backup-check.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Разложить таймер контроля свежести копий
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      [Unit]
      Description=Контроль свежести резервных копий Nekta

      [Timer]
      OnCalendar=*-*-* 09:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/nekta-backup-check.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon

- name: Включить таймеры
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - nekta-backup.timer
    - nekta-backup-check.timer
