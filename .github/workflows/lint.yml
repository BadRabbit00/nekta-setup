name: lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить инструменты
        run: pip install ansible-core ansible-lint yamllint

      - name: Установить коллекции
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Синтаксический разбор плейбуков
        run: |
          for pb in playbooks/*.yml; do
            echo "== $pb"
            ansible-playbook --syntax-check "$pb"
          done

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис скриптов ИБП
        run: |
          for f in roles/nut/templates/upssched-cmd.j2 \
                   roles/nut/templates/nekta-ups-shutdown.j2; do
            echo "== $f"
            sed 's/{%[^%]*%}//g; s/{{[^}]*}}/X/g' "$f" | bash -n -
          done
